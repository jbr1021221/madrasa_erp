<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkbox Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .form-wrapper {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 12px;
            border: 1px solid #51272f;
        }

        .checkboxes {
            display: block;
            text-align: center;
            margin-bottom: 8px;
            background: #e8f4f8;
            padding: 10px;
        }

        .checkbox-wrapper {
            display: inline-flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
            background: #fff3cd;
            padding: 10px;
        }

        .checkboxes label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 600;
        }

        .checkbox-box {
            width: 12px;
            height: 12px;
            border: 1.5px solid #51272f;
            display: inline-block;
            background: white;
            flex-shrink: 0;
        }

        h1 {
            text-align: center;
            font-size: 18px;
            margin-bottom: 10px;
            text-transform: uppercase;
            color: #51272f;
            border-bottom: 4px solid #51272f;
            padding-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="form-wrapper">
        <h1>ADMISSION FORM</h1>

        <div class="checkboxes">
            <div class="checkbox-wrapper">
                <label><span class="checkbox-box"></span> Hifz</label>
                <label><span class="checkbox-box"></span> Schooling</label>
            </div>
        </div>

        <p style="text-align: center; margin-top: 20px; color: #666;">
            The blue background shows the outer container (.checkboxes)<br>
            The yellow background shows the inner wrapper (.checkbox-wrapper)<br>
            The wrapper should be centered, and checkboxes should align from the left.
        </p>
    </div>
</body>

</html>
